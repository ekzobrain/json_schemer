# A service speaking XML both ways, described in OpenAPI 3.0: attributes, a wrapped and an unwrapped list, a
# referenced component under a property, nullable, dates, an error body of its own, a list as the whole body
openapi: 3.0.3
info:
  title: Pet Store XML
  version: 1.0.0
servers:
  - url: https://xml.example.com/v1
paths:
  /pets:
    post:
      summary: Create a pet
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: Created
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Refused
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List pets
      parameters:
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The pets
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/Pets"
components:
  schemas:
    Pet:
      type: object
      required: [name]
      xml:
        name: pet
      properties:
        id:
          type: integer
          format: int64
          xml:
            attribute: true
        name:
          type: string
        born:
          type: string
          format: date
        weight:
          type: number
          nullable: true
        vaccinated:
          type: boolean
        category:
          $ref: "#/components/schemas/Category"
        photoUrls:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: photoUrl
        tags:
          type: array
          items:
            type: string
            xml:
              name: tag
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Pets:
      type: array
      xml:
        name: pets
        wrapped: true
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      xml:
        name: error
      properties:
        code:
          type: integer
          xml:
            attribute: true
        message:
          type: string
